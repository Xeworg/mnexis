[package]
name = "mnexis"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Local-first memory engine prototype for AI agents"
license = "UNLICENSED"

[lib]
name = "mnexis_core"
path = "src/lib.rs"

[[bin]]
name = "mnexis"
path = "src/main.rs"

[dependencies]
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
clap = { version = "=4.5.53", features = ["derive"] }
futures = "=0.3.34"
lancedb = { version = "=0.37.1", default-features = false }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=3.3.0", features = ["macros", "server", "transport-io"] }
# Keep the proc-macro API aligned with rmcp; its upstream semver range accepts newer macros.
rmcp-macros = "=3.3.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "time"] }
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
