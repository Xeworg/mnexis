[package]
name = "mnexis"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Local-first memory engine for AI agents"
license = "MIT"
authors = ["xeworg"]
homepage = "https://github.com/Xeworg/mnexis"
repository = "https://github.com/Xeworg/mnexis"
publish = false

[lib]
name = "mnexis_core"
path = "src/lib.rs"

[[bin]]
name = "mnexis"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.53", features = ["derive"] }
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rmcp = { version = "=3.3.0", features = ["macros", "server", "transport-io"] }
# Keep the proc-macro API aligned with rmcp; its upstream semver range accepts newer macros.
rmcp-macros = "=3.3.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
jsonschema = { version = "=0.58.6", default-features = false }
tempfile = "=3.23.0"
criterion = "0.5"
# Test-only client features: the release binary stays server-only.
rmcp = { version = "=3.3.0", features = ["client", "transport-child-process"] }

[[bench]]
name = "fts5_latency"
harness = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
